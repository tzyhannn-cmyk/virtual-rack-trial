# Mengaktifkan dukungan AndroidX untuk pustaka modern
android.useAndroidX=true

# Alokasi RAM (Heap Space) untuk mencegah OutOfMemoryError saat packaging APK
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# Matikan cache agar build di GitHub Actions bersih
org.gradle.caching=false
